<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#062747">
<meta name="description"
content="Explore automotive spare parts catalogues from First Priority Auto Spare Parts Trading L.L.C, Dubai.">
<title>Product Catalogue | First Priority Auto Spare Parts</title>
<style>
:root {
  --navy:#062747;
  --blue:#079ac7;
  --border:#e2eaf0;
  --ink:#153247;
  --white:#fff;
}
* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}
body {
  font-family:Inter,Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:#f7fafc;
  min-height:100vh;
  line-height:1.6;
}
a {
  color:inherit;
  text-decoration:none;
}
/* ================= HEADER ================= */
.site-header {
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--border);
  box-shadow:0 5px 22px rgba(6,39,71,.05);
}
.navbar {
  max-width:1200px;
  min-height:88px;
  margin:auto;
  padding:12px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
}
.brand img {
  width:58px;
  height:58px;
  object-fit:contain;
}
.brand-name {
  color:var(--navy);
  font-size:16px;
  font-weight:850;
  line-height:1.2;
}
.brand-name span {
  display:block;
  color:var(--blue);
  font-size:9px;
  letter-spacing:1.7px;
  margin-top:5px;
}
.nav-links {
  display:flex;
  align-items:center;
  gap:28px;
  font-size:13px;
  font-weight:700;
  color:#29485d;
}
.nav-links a:hover {
  color:var(--blue);
}
/* ================= CATALOGUE PAGE ================= */
.catalogue-section {
  width:calc(100% - 48px);
  max-width:1400px;
  min-height:65vh;
  margin:35px auto 65px;
}
.back-link {
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-bottom:24px;
  color:var(--blue);
  font-size:13px;
  font-weight:750;
}
.back-link:hover {
  color:var(--navy);
}
/* ================= CENTRED HEADING ================= */
.catalogue-heading {
  width:100%;
  text-align:center;
  margin:0 auto 25px;
}
.catalogue-heading h1 {
  color:var(--navy);
  font-size:clamp(27px,4vw,42px);
  font-weight:850;
  line-height:1.2;
  letter-spacing:.5px;
  text-transform:uppercase;
}
/* ================= LARGE CATALOGUE IMAGE ================= */
.catalogue-image-container {
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:0 auto;
}
.catalogue-image {
  display:block;
  width:100%;
  max-width:1200px;
  max-height:78vh;
  height:auto;
  object-fit:contain;
  object-position:center;
}
/* ================= LOADING / EMPTY STATES ================= */
.status {
  text-align:center;
  padding:65px 20px;
  color:#637786;
  font-size:14px;
}
.status-icon {
  display:block;
  margin-bottom:12px;
  font-size:32px;
}
.error-message {
  color:#b42318;
}
.retry-button {
  display:inline-block;
  margin-top:18px;
  padding:11px 20px;
  border:0;
  border-radius:7px;
  background:var(--navy);
  color:#fff;
  font-size:12px;
  font-weight:750;
  cursor:pointer;
}
.retry-button:hover {
  background:var(--blue);
}
/* ================= FOOTER ================= */
.site-footer {
  background:#12344c;
  color:#fff;
  padding:24px;
  text-align:center;
  font-size:12px;
}
/* ================= TABLET ================= */
@media(max-width:900px) {
  .catalogue-image {
    max-height:75vh;
  }
}
/* ================= MOBILE ================= */
@media(max-width:650px) {
  .navbar {
    min-height:72px;
    padding:10px 16px;
  }
  .brand img {
    width:45px;
    height:45px;
  }
  .brand-name {
    font-size:12px;
  }
  .brand-name span {
    font-size:7px;
    letter-spacing:1px;
  }
  .nav-links {
    gap:12px;
    font-size:11px;
  }
  .catalogue-section {
    width:calc(100% - 24px);
    margin:27px auto 40px;
  }
  .back-link {
    margin-bottom:22px;
  }
  .catalogue-heading {
    margin-bottom:20px;
  }
  .catalogue-heading h1 {
    font-size:27px;
  }
  .catalogue-image {
    width:100%;
    max-height:none;
    height:auto;
  }
}
</style>
</head>
<body>
<!-- ================= HEADER ================= -->
<header class="site-header">
  <div class="navbar">
    <a href="index.html" class="brand">
      <img src="fp-logo.jpeg"
           alt="First Priority Logo">
      <div class="brand-name">
        FIRST PRIORITY
        <span>AUTO SPARE PARTS TRADING L.L.C</span>
      </div>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>
<!-- ================= CATALOGUE ================= -->
<main class="catalogue-section">
  <a href="index.html" class="back-link">
    ← Back to Home
  </a>
  <div id="catalogueContent">
    <div class="status">
      <span class="status-icon">⏳</span>
      Loading catalogue...
    </div>
  </div>
</main>
<!-- ================= FOOTER ================= -->
<footer class="site-footer">
  © <span id="year"></span>
  First Priority Auto Spare Parts Trading LLC.
  All rights reserved.
</footer>
<!-- ================= SUPABASE ================= -->
<script type="module">
import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
/* ================= SUPABASE CONNECTION ================= */
const SUPABASE_URL =
"https://jnuqizxawrdsipntvmfa.supabase.co";
const SUPABASE_KEY =
"sb_publishable_yi1cUBhXGUe9qaCaLIwo3w_OrGyQ2_M";
const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
/* ================= ELEMENTS ================= */
const content =
document.getElementById("catalogueContent");
document.getElementById("year").textContent =
new Date().getFullYear();
/* ================= STATUS ================= */
function showStatus(message, type = "") {
  content.replaceChildren();
  const box = document.createElement("div");
  box.className = "status " + type;
  box.textContent = message;
  content.appendChild(box);
}
/* ================= IMAGE URL ================= */
function getCatalogueImage(imagePath) {
  if (!imagePath) return null;
  const cleanPath = String(imagePath)
    .replace(/^\/+/, "");
  const { data } = supabase
    .storage
    .from("product-images")
    .getPublicUrl(cleanPath);
  return data.publicUrl;
}
/* ================= LOAD CATALOGUE ================= */
async function loadCatalogue() {
  showStatus("Loading catalogue...");
  const params = new URLSearchParams(
    window.location.search
  );
  const slug = params.get("category");
  if (!slug) {
    showStatus(
      "Please select a catalogue from the Products menu."
    );
    return;
  }
  try {
    /* GET CATEGORY */
    const { data: category, error: categoryError } =
      await supabase
        .from("categories")
        .select("id,name,slug,is_active")
        .eq("slug", slug)
        .eq("is_active", true)
        .maybeSingle();
    if (categoryError) {
      throw categoryError;
    }
    if (!category) {
      showStatus(
        "Category not found. Please check the category slug in Supabase."
      );
      return;
    }
    /* GET ONE CATALOGUE IMAGE */
    const { data: product, error: productError } =
      await supabase
        .from("products")
        .select("image_path")
        .eq("category_id", category.id)
        .eq("is_active", true)
        .not("image_path", "is", null)
        .order("created_at", { ascending: false })
        .limit(1)
        .maybeSingle();
    if (productError) {
      throw productError;
    }
    /* PAGE TITLE */
    const headingText = category.name
      .replace(/\s+category$/i, "")
      .trim()
      .toUpperCase();
    document.title =
      `${headingText} | First Priority Auto Spare Parts`;
    /* CHECK IMAGE */
    if (!product || !product.image_path) {
      showStatus(
        "The catalogue image has not been uploaded yet."
      );
      return;
    }
    /* GET IMAGE URL */
    const imageURL =
      getCatalogueImage(product.image_path);
    if (!imageURL) {
      showStatus(
        "Unable to find the catalogue image."
      );
      return;
    }
    /* CREATE HEADING */
    const heading = document.createElement("div");
    heading.className = "catalogue-heading";
    const title = document.createElement("h1");
    title.textContent = headingText;
    heading.appendChild(title);
    /* CREATE LARGE IMAGE */
    const imageContainer = document.createElement("div");
    imageContainer.className =
      "catalogue-image-container";
    const image = document.createElement("img");
    image.className = "catalogue-image";
    image.alt = `${headingText} catalogue`;
    image.src = imageURL;
    image.addEventListener("error", () => {
      showStatus(
        "Unable to display the image. Please check the Storage image path and bucket permissions.",
        "error-message"
      );
    });
    imageContainer.appendChild(image);
    content.replaceChildren(
      heading,
      imageContainer
    );
  } catch (error) {
    console.error(
      "Catalogue loading error:",
      error
    );
    showStatus(
      "Unable to load the catalogue. Please check your Supabase connection and database permissions.",
      "error-message"
    );
    const retry = document.createElement("button");
    retry.className = "retry-button";
    retry.textContent = "Try Again";
    retry.addEventListener("click", loadCatalogue);
    content.appendChild(retry);
  }
}
/* ================= INITIALISE ================= */
loadCatalogue();
</script>
</body>
</html>
